<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="CYJ - AI · LLM · Backend">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#151A3A"/>
      <stop offset="1" stop-color="#2A1B4D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C9CFF"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .float1 { animation: float 9s ease-in-out infinite; }
      .float2 { animation: float 11s ease-in-out infinite reverse; }
      .spin   { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
      .pulse  { animation: pulse 3.2s ease-in-out infinite; }
      .p2 { animation-delay: .8s; } .p3 { animation-delay: 1.6s; } .p4 { animation-delay: 2.4s; }
      .edge { stroke-dasharray: 4 6; animation: flow 6s linear infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes spin  { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes flow  { to { stroke-dashoffset: -100; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- geometric shapes -->
    <g class="float1">
      <circle cx="905" cy="150" r="96" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.55"/>
      <circle cx="905" cy="150" r="60" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    </g>
    <g class="spin">
      <polygon points="1045,58 1105,162 985,162" fill="none" stroke="#C084FC" stroke-opacity="0.6" stroke-width="1.5"/>
    </g>
    <g class="float2">
      <rect x="760" y="210" width="64" height="64" rx="12" fill="#7C9CFF" fill-opacity="0.12" stroke="#7C9CFF" stroke-opacity="0.5" transform="rotate(18 792 242)"/>
      <rect x="1085" y="225" width="38" height="38" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" transform="rotate(-12 1104 244)"/>
    </g>

    <!-- small neural network motif -->
    <g stroke="url(#accent)" stroke-width="1.2" stroke-opacity="0.7" fill="none">
      <path class="edge" d="M845 110 L905 150 L965 95"/>
      <path class="edge" d="M845 195 L905 150 L965 205"/>
      <path class="edge" d="M965 95 L1015 150 L965 205"/>
    </g>
    <g fill="#E9E5FF">
      <circle class="pulse"    cx="845"  cy="110" r="4.5"/>
      <circle class="pulse p2" cx="845"  cy="195" r="4.5"/>
      <circle class="pulse p3" cx="965"  cy="95"  r="4.5"/>
      <circle class="pulse p4" cx="965"  cy="205" r="4.5"/>
      <circle                  cx="905"  cy="150" r="7" fill="url(#accent)"/>
      <circle class="pulse p2" cx="1015" cy="150" r="5.5"/>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
      <text x="88" y="118" fill="#9AA6D9" font-size="18" letter-spacing="5" font-weight="600">HELLO, I'M</text>
      <text x="84" y="196" fill="#FFFFFF" font-size="84" font-weight="800" letter-spacing="2">CYJ</text>
      <rect x="88" y="218" width="64" height="4" rx="2" fill="url(#accent)"/>
      <text x="88" y="258" fill="#C9CEEA" font-size="20" letter-spacing="1.5">AI · LLM · Backend Developer</text>
    </g>
  </g>
</svg>
